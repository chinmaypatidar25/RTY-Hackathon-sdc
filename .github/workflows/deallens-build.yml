name: DealLens build verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Smoke test running app and research agent
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3333 > /tmp/deallens-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..45}; do
            if curl --silent --fail http://127.0.0.1:3333/api/health -o /tmp/deallens-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/deallens-health.json
          curl --fail --silent http://127.0.0.1:3333/ -o /tmp/deallens-home.html
          grep -q 'Every property has a story' /tmp/deallens-home.html
          curl --fail --silent http://127.0.0.1:3333/agent -o /tmp/deallens-agent.html
          grep -q 'Meet your real-estate' /tmp/deallens-agent.html
          curl --fail --silent http://127.0.0.1:3333/api/agent/status -o /tmp/deallens-status.json
          grep -q '"mode":"demo"' /tmp/deallens-status.json
          curl --fail --silent -X POST http://127.0.0.1:3333/api/agent \
            -H 'Content-Type: application/json' \
            -d '{"question":"Is the advertised eight percent yield correct?","deal":{"name":"Bhopal apartment","price":8000000,"monthlyRent":25000,"advertisedYield":8,"annualExpenses":36000,"vacancyRate":5,"closingCosts":550000}}' \
            | node -e "let b='';process.stdin.on('data',d=>b+=d);process.stdin.on('end',()=>{let a=JSON.parse(b);if(a.mode!=='demo'||a.steps?.length!==3||!a.answer.includes('3.75%'))process.exit(1);console.log('Agent runtime OK: three tools, correct 3.75% yield')})"
          curl --fail --silent -X POST http://127.0.0.1:3333/api/extract \
            -H 'Content-Type: application/json' \
            -d '{"text":"Asking price ₹80 lakh. Monthly rent ₹25,000. 1400 sqft. Advertised yield 8%."}' \
            | node -e "let b='';process.stdin.on('data',d=>b+=d);process.stdin.on('end',()=>{let a=JSON.parse(b);if(a.mode!=='fallback'||a.deal.price!==8000000||a.deal.monthlyRent!==25000)process.exit(1);console.log('Listing extraction runtime OK')})"
